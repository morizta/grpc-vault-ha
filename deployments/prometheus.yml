global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers: []

rule_files: []

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'vault-gateway'
    static_configs:
      - targets: ['host.docker.internal:8081']
    metrics_path: /metrics

  - job_name: 'vault-auth'
    static_configs:
      - targets: ['host.docker.internal:9091']
    metrics_path: /metrics

  - job_name: 'vault-crypto'
    static_configs:
      - targets: ['host.docker.internal:9092']
    metrics_path: /metrics

  - job_name: 'vault-tokenize'
    static_configs:
      - targets: ['host.docker.internal:9093']
    metrics_path: /metrics

  - job_name: 'vault-lock'
    static_configs:
      - targets: ['host.docker.internal:9094']
    metrics_path: /metrics

  - job_name: 'vault-audit'
    static_configs:
      - targets: ['host.docker.internal:9095']
    metrics_path: /metrics
